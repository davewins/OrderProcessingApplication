    __SlAsH____SlAsH__OrderProcessing.module__SlAsH____SlAsH__LogLevel: INFO
    __SlAsH____SlAsH__OrderProcessing.module__SlAsH____SlAsH__EMSURL: tcp://192.168.1.30:9011
