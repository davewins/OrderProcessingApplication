  BW_ENGINE_THREADCOUNT: '8'
  BW_LOGGER_OVERRIDES: ROOT=ERROR
  BW_OTEL_TRACES_ENABLED: 'false'
engineSecrets: {}
executionHistory:
  enabled: false
fluentBit:
  enabled: true
  resources:
